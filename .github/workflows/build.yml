name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Verify pre-built addon (arch, ABI deps, staleness)
        run: |
          test -f dist/libmacro-ime-state.so || {
            echo "ERROR: dist/libmacro-ime-state.so not found"
            echo "Build it: cmake -S engine/macro-ime-state -B build && cmake --build build && cp build/libmacro-ime-state.so dist/"
            exit 1
          }
          file dist/libmacro-ime-state.so
          readelf -h dist/libmacro-ime-state.so | grep -q "Shared object"
          readelf -h dist/libmacro-ime-state.so | grep -q "X86-64"
          echo "OK: addon is a valid x86-64 ELF shared object"
          # The addon must only depend on fcitx5 runtime libs this project
          # expects (ABI contract: libFcitx5Core.so.7, Config.so.6, Utils.so.2).
          needed=$(readelf -d dist/libmacro-ime-state.so | grep NEEDED)
          for lib in libFcitx5Core.so.7 libFcitx5Config.so.6 libFcitx5Utils.so.2; do
            echo "$needed" | grep -q "$lib" || { echo "ERROR: missing expected NEEDED dependency: $lib"; exit 1; }
          done
          echo "OK: addon ABI dependency set as expected"
          # Staleness: the committed .so must have been built from the
          # currently committed sources (aggregated hash recorded at build time:
          # cpp + CMakeLists + conf.in).
          test -f dist/libmacro-ime-state.so.src || {
            echo "ERROR: dist/libmacro-ime-state.so.src (source hash sidecar) missing"
            echo "Regenerate: sha256sum engine/macro-ime-state/macro-ime-state.cpp engine/macro-ime-state/CMakeLists.txt engine/macro-ime-state/macro-ime-state.conf.in | sha256sum | cut -d' ' -f1 > dist/libmacro-ime-state.so.src"
            exit 1
          }
          recorded=$(tr -d '[:space:]' < dist/libmacro-ime-state.so.src)
          actual=$(sha256sum engine/macro-ime-state/macro-ime-state.cpp \
                             engine/macro-ime-state/CMakeLists.txt \
                             engine/macro-ime-state/macro-ime-state.conf.in \
                   | sha256sum | cut -d' ' -f1)
          if [[ "$recorded" != "$actual" ]]; then
            echo "ERROR: dist/libmacro-ime-state.so is STALE — addon sources changed since it was built."
            echo "Rebuild: cmake -S engine/macro-ime-state -B build && cmake --build build && cp build/libmacro-ime-state.so dist/"
            echo "  then regenerate the sidecar (see instructions above)"
            exit 1
          fi
          echo "OK: addon matches current sources (staleness check passed)"

      - name: Verify repo structure
        run: |
          for f in install.sh VERSION \
                    bin/macro-ime-config \
                    themes/macro-ime-theme themes/hook-theme-set.sh \
                    plugins/macro-ime.indicator/manifest.json \
                    plugins/macro-ime.settings/manifest.json; do
            test -f "$f" || { echo "ERROR: missing $f"; exit 1; }
          done
          echo "OK: all required files present"

      - name: Lint all shell scripts (syntax)
        run: |
          for s in install.sh bin/macro-ime-config themes/macro-ime-theme themes/hook-theme-set.sh; do
            bash -n "$s" || { echo "ERROR: syntax error in $s"; exit 1; }
          done
          echo "OK: syntax valid"

      - name: shellcheck all shell scripts
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck install.sh bin/macro-ime-config themes/macro-ime-theme themes/hook-theme-set.sh
          echo "OK: shellcheck clean"

      - name: Smoke test install.sh (executable paths)
        run: |
          # 1. --help must run and exit 0
          ./install.sh --help > /dev/null
          echo "OK: --help"
          # 2. Unknown option must be rejected
          if ./install.sh --bogus-option 2> /dev/null; then
            echo "ERROR: unknown option was not rejected"; exit 1
          fi
          echo "OK: unknown option rejected"
          # 3. Regression guard: every step function must be DEFINED before the
          #    main section (v0.1.0 shipped with call-before-definition -> exit 127).
          head -n "$(grep -n '^# --- main' install.sh | cut -d: -f1)" install.sh > /tmp/defs.sh
          bash -c 'source /tmp/defs.sh
          for f in require_commands on_error service_running stop_fcitx restart_fcitx \
                   restore_file backup_file_once restore_plugin_dir undo load_version \
                   preflight_platform prepare_addon_artifact assert_sha256 check_lm_size \
                   download_public_asset \
                   prepare_language_model commit_language_model write_manifest \
                   install_addon build_state_addon_to install_runtime install_plugins \
                   prepare_fcitx_config commit_fcitx_config health_check apply_and_activate; do
            declare -F "$f" > /dev/null || { echo "MISSING before main: $f"; exit 1; }
          done'
          echo "OK: all step functions defined before main"

      - name: Verify public model contract
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          model_release=$(sed -n 's/^MODEL_RELEASE="\([^"]*\)"/\1/p' install.sh)
          lm_sha=$(sed -n 's/^LM_SHA256="\([^"]*\)"/\1/p' install.sh)
          predict_sha=$(sed -n 's/^LM_PREDICT_SHA256="\([^"]*\)"/\1/p' install.sh)
          release=$(curl --fail --silent --show-error \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/forbidden-game/macro-ime/releases/tags/$model_release")
          actual_lm=$(jq -r '.assets[] | select(.name == "zh_CN.lm") | .digest | sub("^sha256:"; "")' <<<"$release")
          actual_predict=$(jq -r '.assets[] | select(.name == "zh_CN.lm.predict") | .digest | sub("^sha256:"; "")' <<<"$release")
          test "$actual_lm" = "$lm_sha"
          test "$actual_predict" = "$predict_sha"
          echo "OK: pinned public model assets and installer digests agree"

  build-addon:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Build release addon against current Arch Fcitx
        run: |
          docker run --rm \
            -v "$PWD:/src" -w /src \
            archlinux:base-devel bash -lc '
              pacman -Syu --noconfirm cmake fcitx5
              cmake -S engine/macro-ime-state -B build-ci -DCMAKE_BUILD_TYPE=Release
              cmake --build build-ci --parallel
              pacman -Q fcitx5 glibc gcc-libs
            '

      - name: Verify generated addon ABI
        run: |
          file build-ci/libmacro-ime-state.so
          readelf -h build-ci/libmacro-ime-state.so | grep -q "X86-64"
          needed=$(readelf -d build-ci/libmacro-ime-state.so | grep NEEDED)
          for lib in libFcitx5Core.so.7 libFcitx5Config.so.6 libFcitx5Utils.so.2; do
            echo "$needed" | grep -q "$lib" || {
              echo "ERROR: current Arch Fcitx ABI changed; missing $lib"
              exit 1
            }
          done
          echo "OK: release addon targets x86-64 / Fcitx Core ABI 7"

      - uses: actions/upload-artifact@v4
        with:
          name: macro-ime-addon-linux-x86_64-fcitx5core7
          path: build-ci/libmacro-ime-state.so
          if-no-files-found: error

  # Release: triggered by git tag (e.g. v1.0.0)
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [verify, build-addon]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: macro-ime-addon-linux-x86_64-fcitx5core7
          path: release-dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-dist/libmacro-ime-state.so
          draft: true
          generate_release_notes: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

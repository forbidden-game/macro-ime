name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Verify pre-built addon
        run: |
          test -f dist/libomarime-state.so || {
            echo "ERROR: dist/libomarime-state.so not found"
            echo "Build it locally: cmake -S engine/omarime-state -B build && cmake --build build && cp build/libomarime-state.so dist/"
            exit 1
          }
          file dist/libomarime-state.so
          readelf -h dist/libomarime-state.so | grep -q "Shared object"
          echo "OK: addon is a valid ELF shared object"

      - name: Verify repo structure
        run: |
          for f in install.sh bin/omarime-config \
                    themes/omarime-theme themes/hook-theme-set.sh \
                    plugins/omarime.indicator/manifest.json \
                    plugins/omarime.settings/manifest.json; do
            test -f "$f" || { echo "ERROR: missing $f"; exit 1; }
          done
          echo "OK: all required files present"

      - name: Lint install.sh
        run: |
          bash -n install.sh
          echo "OK: install.sh syntax valid"

  # Release: triggered by git tag (e.g. v1.0.0)
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/libomarime-state.so
          draft: true
          generate_release_notes: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
